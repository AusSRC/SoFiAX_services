# http
server {
    listen 80;
    server_name _;
    return 301  https://$host$request_uri;
}

# https
server {
    listen 443 ssl;
    server_name _;
    port_in_redirect off;

    # all ssl related config moved to ssl.conf
	include /config/nginx/ssl.conf;

    client_max_body_size 8G;

    resolver 127.0.0.11;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_redirect off;

    location /tap {
        set $gavo gavo;
        proxy_pass http://$gavo:8080;
    }

    location /__system__ {
        set $gavo gavo;
        proxy_pass http://$gavo:8080;
    }

    location /progress {
        set $survey_progress survey_progress;
        proxy_pass http://$survey_progress:8080;
    }

    location /api {
        set $survey_progress survey_progress;
        proxy_pass http://$survey_progress:3000;
    }

    location /survey {
        set $gavo gavo;
        proxy_pass http://$gavo:8080;
    }

    location / {
        set $web web;
        proxy_pass http://$web:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/services/survey_web/src/static/;
    }

    location /media/ {
        alias /opt/services/survey_web/src/media/;
    }
}
