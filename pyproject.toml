[project]
name = "SoFiAX_services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "python-templates",
    "web/survey/migrations",
    "web/static",
    "web/media",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741", "E722", "E501"]
