name: Linting
on: [push]
jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

