version: '3.5'

services:
  database:
    container_name: database
    shm_size: '32gb'
    build:
      context: db/
      shm_size: '32gb'
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - /data:/var/lib/postgresql/data
    networks:
      - survey_network

  web:
    container_name: web
    build:
      context: web
    env_file:
      - .env
    ports:
      - 8000:8000
    volumes:
      - ./web:/opt/services/survey_web/src
      - static_volume:/opt/services/survey_web/src/static
      - media_volume:/opt/services/survey_web/src/media
    networks:
      - survey_network

  nginx:
    container_name: app_nginx
    build:
      context: nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl.conf:/config/nginx/ssl.conf
      - static_volume:/opt/services/survey_web/src/static
      - media_volume:/opt/services/survey_web/src/media
    networks:
      - survey_network

  gavo:
    container_name: gavo
    build:
      context: vo
    env_file:
      - .env
    volumes:
      - /var/gavo/state:/var/gavo/state
      - /var/gavo/cache:/var/gavo/cache
      - /var/gavo/tmp:/var/gavo/tmp
    ports:
      - 8080:8080
    networks:
      - survey_network

networks:
  survey_network:
    external: true
    name: survey_network

volumes:
  static_volume:
  media_volume:
